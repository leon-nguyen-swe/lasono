name: CI

# Runs on every push and on pull requests into main. A new run on the same ref cancels the old one.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL next to the job, used by the tests tagged "postgres".
    # Same database name and credentials as src/test/resources/application-postgres-test.yaml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lasono_test
          POSTGRES_USER: lasono
          POSTGRES_PASSWORD: lasono
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lasono -d lasono_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Run backend tests
        run: ./gradlew test

      - name: Run Postgres tests
        run: ./gradlew postgresTest

      # The tests tagged "ffmpeg" run the real ffmpeg and ffprobe programs.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run ffmpeg tests
        run: ./gradlew ffmpegTest

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version the app is developed with, so a new Flutter release cannot break CI.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run app tests
        run: flutter test
