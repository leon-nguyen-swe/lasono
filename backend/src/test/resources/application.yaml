spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

lasono:
  jwt:
    # Only for tests. The real secret comes from the LASONO_JWT_SECRET environment variable.
    secret: test-only-secret-that-is-at-least-32-bytes-long
  storage:
    root: /tmp/lasono-test-storage
  processing:
    # No background thread should take jobs behind the back of a test; the worker test turns it on.
    worker-enabled: false
