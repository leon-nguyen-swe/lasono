plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.lasono'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	
	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'

	// Docs
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
}

tasks.named('test') {
	useJUnitPlatform {
		// These need a real PostgreSQL or the ffmpeg program, see the postgresTest and ffmpegTest tasks below.
		excludeTags 'postgres', 'ffmpeg'
	}
}

// Tests tagged "ffmpeg" run the real ffmpeg and ffprobe programs, which must be installed.
// Kept out of `test` and `build` so those still work on a machine without them.
tasks.register('ffmpegTest', Test) {
	description = 'Runs the tests tagged "ffmpeg" with the real ffmpeg and ffprobe programs.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ffmpeg'
	}
	shouldRunAfter tasks.named('test')
}

// Tests tagged "postgres" run against the lasono_test database of a real PostgreSQL (see README).
// Kept out of `test` and `build` so those still work without a database.
tasks.register('postgresTest', Test) {
	description = 'Runs the tests tagged "postgres" against a real PostgreSQL database.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'postgres'
	}
	shouldRunAfter tasks.named('test')
}
