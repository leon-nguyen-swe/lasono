services:
  postgres:
    image: postgres:17
    container_name: lasono-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lasono
      POSTGRES_USER: lasono
      POSTGRES_PASSWORD: lasono

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: